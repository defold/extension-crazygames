<!DOCTYPE html>
<head>
	<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>

<body>
	<script id='crazygames-sdk-setup' type='text/javascript'>
		var data = {};
		var isLoadStarted = false;
		var isLoadFinished = false;
		var latestLoadingPercentage = null;
		var isCrazyGamesInitialized = false;
		var isCrazyGamesInitializationComplete = false;
		var isRuntimeInitialized = false;
		var isApplicationStarted = false;

		function isCrazyGamesAvailable() {
			if (!window.CrazyGames || !window.CrazyGames.SDK) {
				return false;
			}
			var environment = window.CrazyGames.SDK.environment;
			return environment === "local" || environment === "crazygames";
		}

		function updateCrazyGamesLoadingState() {
			if (!isCrazyGamesInitialized || !isCrazyGamesAvailable() || latestLoadingPercentage === null) {
				return;
			}

			try {
				if (!isLoadStarted) {
					window.CrazyGames.SDK.game.loadingStart();
					isLoadStarted = true;
				}
				if (latestLoadingPercentage >= 100 && !isLoadFinished) {
					window.CrazyGames.SDK.game.loadingStop();
					isLoadFinished = true;
				}
			} catch (error) {
				console.error("Failed to update CrazyGames loading state", error);
			}
		}

		function startApplicationIfReady() {
			if (isRuntimeInitialized && isCrazyGamesInitializationComplete && !isApplicationStarted) {
				isApplicationStarted = true;
				Module.runApp("canvas");
			}
		}

		Progress.addListener(function(percentage){
			latestLoadingPercentage = percentage;
			updateCrazyGamesLoadingState();
		});

		async function initCrazyGames() {
			try {
				await window.CrazyGames.SDK.init();
				isCrazyGamesInitialized = true;
				updateCrazyGamesLoadingState();
			} catch (error) {
				console.error("Failed to initialize CrazyGames SDK; starting without it", error);
			} finally {
				isCrazyGamesInitializationComplete = true;
				startApplicationIfReady();
			}
		}

		Module['onRuntimeInitialized'] = function() {
			isRuntimeInitialized = true;
			startApplicationIfReady();
		};

		initCrazyGames();
	</script>

	<div id="app-container">
		<div id="canvas-container">
			<div id="banner-container" style="position: absolute; bottom: 0%; left: 0%; display: none;"></div>
		</div>
	</div>
</body>
</html>
